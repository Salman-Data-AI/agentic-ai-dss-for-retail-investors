name: Build Check

on:
  pull_request:
    # Change this branch list if the repository default branch changes.
    branches:
      - main
  push:
    # Change this branch list if the repository default branch changes.
    branches:
      - main

permissions:
  contents: read

jobs:
  build-check:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build installer
        id: build
        uses: ./.github/actions/build-installer

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: AgenticDSS-Setup
          path: ${{ steps.build.outputs.setup-exe }}
          if-no-files-found: error
          retention-days: 14
