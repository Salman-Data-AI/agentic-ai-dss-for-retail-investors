name: Build Windows Installer
description: Build and validate the PyInstaller onedir app and Inno Setup installer.

inputs:
  python-version:
    description: Python version to install on the runner.
    required: false
    default: "3.13.5"
  spec-path:
    description: PyInstaller spec file path.
    required: false
    default: agentic_dss.spec
  iss-path:
    description: Inno Setup script path.
    required: false
    default: installer\AgenticDSS.iss
  setup-exe:
    description: Expected installer output path.
    required: false
    default: installer\output\AgenticDSS-Setup.exe

outputs:
  setup-exe:
    description: Path to the built installer executable.
    value: ${{ steps.installer-output.outputs.setup-exe }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: |
          requirements.txt
          requirements-dev.txt

    - name: Install dependencies
      shell: pwsh
      run: python -m pip install -r requirements.txt -r requirements-dev.txt

    - name: Test gate (offline, no keys)
      shell: pwsh
      run: python -m pytest

    - name: Build onedir app
      shell: pwsh
      run: python -m PyInstaller "${{ inputs.spec-path }}" --noconfirm

    - name: KEY-LEAK GUARD (dist)
      shell: pwsh
      run: ./scripts/assert-no-release-secrets.ps1 -Path dist

    - name: Prepare installer input
      shell: pwsh
      run: |
        if (Test-Path -LiteralPath dist-fixed) {
          Remove-Item -LiteralPath dist-fixed -Recurse -Force
        }
        New-Item -ItemType Directory -Path dist-fixed | Out-Null
        Copy-Item -LiteralPath dist\AgenticDSS -Destination dist-fixed\AgenticDSS -Recurse

    - name: KEY-LEAK GUARD (installer input)
      shell: pwsh
      run: ./scripts/assert-no-release-secrets.ps1 -Path dist-fixed

    - name: Install Inno Setup
      shell: pwsh
      run: choco install innosetup -y

    - name: Compile installer
      shell: pwsh
      run: iscc "${{ inputs.iss-path }}"

    - name: KEY-LEAK GUARD (installer output)
      shell: pwsh
      run: ./scripts/assert-no-release-secrets.ps1 -Path installer\output

    - name: Resolve installer output
      id: installer-output
      shell: pwsh
      run: |
        $setupExe = "${{ inputs.setup-exe }}"
        if (-not (Test-Path -LiteralPath $setupExe)) {
          throw "Installer was not produced at expected path: $setupExe"
        }
        "setup-exe=$setupExe" >> $env:GITHUB_OUTPUT
